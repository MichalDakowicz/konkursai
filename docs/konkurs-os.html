<main>
<h1>Zadanie i oś czasu</h1>
<p class="sub">Cel konkursu i terminy.</p>
<p class="lead">Zadanie: zaprojektuj i zaimplementuj aplikację wspierającą edukację z wykorzystaniem elementów sztucznej inteligencji. Liczy się pomysł, użyteczność, kreatywne wykorzystanie AI i jakość wykonania.</p>

<figure>
<svg viewBox="0 0 800 150" role="img" aria-label="Oś czasu konkursu od 14 września do 20 grudnia 2026">
  <rect class="svg-track" x="0" y="60" width="800" height="14" rx="7"/>
  <rect x="0" y="60" width="404" height="14" rx="7" style="fill:var(--accent-soft)"/>
  <rect x="404" y="60" width="223" height="14" style="fill:var(--warn)"/>
  <line class="svg-mark" x1="404" y1="44" x2="404" y2="90"/>
  <text class="svg-t" x="404" y="36" text-anchor="middle">Dziś: 2 XI</text>
  <line class="svg-mark" x1="627" y1="44" x2="627" y2="90" style="stroke:var(--warn)"/>
  <text class="svg-t" x="627" y="36" text-anchor="middle" style="fill:var(--warn)">Zgłoszenie: 29 XI</text>
  <text class="svg-s" x="0" y="112">14 IX: start</text>
  <text class="svg-s" x="800" y="112" text-anchor="end">do 20 XII: wyniki i nagrody</text>
  <text class="svg-t" x="515" y="112" text-anchor="middle">27 dni do zgłoszenia</text>
</svg>
<figcaption>Skala czasu proporcjonalna do dni. Dokładny termin finału zostanie podany po zakończeniu konkursu.</figcaption>
</figure>
</main>
