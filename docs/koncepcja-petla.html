<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedno – Pętla główna</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Pętla główna</h1>
<p class="sub">Rozwiąż, zdiagnozuj, ćwicz, zmierz wzrost.</p>
<figure>
<svg viewBox="0 0 760 230" role="img" aria-label="Pętla: rozwiąż, diagnoza, celowane ćwiczenie, mierzalny wzrost, powrót do rozwiązywania">
  <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="svg-arrow"/></marker></defs>
  <rect class="svg-node" x="20" y="40" width="150" height="70" rx="10"/>
  <text class="svg-t" x="95" y="70" text-anchor="middle">Rozwiąż</text>
  <text class="svg-s" x="95" y="90" text-anchor="middle">arkusz lub zadanie</text>

  <rect class="svg-node" x="210" y="40" width="150" height="70" rx="10"/>
  <text class="svg-t" x="285" y="70" text-anchor="middle">Diagnoza</text>
  <text class="svg-s" x="285" y="90" text-anchor="middle">umiejętność + typ błędu</text>

  <rect class="svg-node" x="400" y="40" width="150" height="70" rx="10"/>
  <text class="svg-t" x="475" y="70" text-anchor="middle">Celowane ćwiczenie</text>
  <text class="svg-s" x="475" y="90" text-anchor="middle">słabe miejsca</text>

  <rect class="svg-node-ok" x="590" y="40" width="150" height="70" rx="10"/>
  <text class="svg-t" x="665" y="70" text-anchor="middle">Mierzalny wzrost</text>
  <text class="svg-s" x="665" y="90" text-anchor="middle">opanowanie przed / po</text>

  <path class="svg-line" d="M170 75H208" marker-end="url(#a1)"/>
  <path class="svg-line" d="M360 75H398" marker-end="url(#a1)"/>
  <path class="svg-line" d="M550 75H588" marker-end="url(#a1)"/>
  <path class="svg-line" d="M665 110V170H95V112" marker-end="url(#a1)"/>
  <text class="svg-s" x="380" y="190" text-anchor="middle">kolejne zadania dobrane do słabych umiejętności</text>
</svg>
<figcaption>Wzrost opanowania jest widoczny jako liczba, co daje mocną scenę do filmu konkursowego.</figcaption>
</figure>
</main>
<script src="nav.js" defer></script>
</body>
</html>
